<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>平静地思考 · Glass Pretzel（原作 Jaenam）</title>
<style>
  :root {
    --accent: #6ea8ff;
    --panel-bg: rgba(14, 17, 28, 0.78);
    --panel-border: rgba(255, 255, 255, 0.09);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f2f2f0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #glcanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #glcanvas.dragging { cursor: grabbing; }

  .title-card {
    position: fixed; left: 18px; bottom: 16px; z-index: 5;
    color: rgba(20, 26, 40, 0.85);
    font-size: 12px; line-height: 1.7; user-select: none;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
    pointer-events: none;
  }
  .title-card b { font-size: 13px; }
  .title-card a { color: inherit; }

  #panel {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    width: 296px; max-height: calc(100vh - 32px);
    background: var(--panel-bg);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    color: #e8ecf4;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
    display: flex; flex-direction: column;
    transition: transform .28s cubic-bezier(.4,0,.2,1), opacity .28s;
  }
  #panel.hidden { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
  #panel .head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--panel-border);
    font-size: 13px; font-weight: 600; letter-spacing: .3px;
  }
  #panel .head .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  #panel .head .spacer { flex: 1; }
  #panel .body { overflow-y: auto; padding: 8px 14px 12px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
  #panel .body::-webkit-scrollbar { width: 6px; }
  #panel .body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }

  .sect {
    padding: 10px 0 1px; font-size: 10.5px; font-weight: 600;
    letter-spacing: 3px; color: #7e8aa4; user-select: none;
  }
  .sect:not(:first-child) { margin-top: 4px; border-top: 1px solid rgba(255,255,255,.06); padding-top: 12px; }

  .ctrl { padding: 7px 0 3px; }
  .ctrl .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; margin-bottom: 3px; }
  .ctrl .row .name { color: #c3ccdd; }
  .ctrl .row .val { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 12px; }
  .ctrl input[type=range] { width: 100%; height: 22px; accent-color: var(--accent); cursor: pointer; background: transparent; }

  .btns { display: flex; gap: 8px; padding: 10px 0 4px; }
  .btns button {
    flex: 1; padding: 7px 0; font-size: 12px;
    color: #dfe6f2; background: rgba(255,255,255,.07);
    border: 1px solid var(--panel-border); border-radius: 8px;
    cursor: pointer; transition: background .15s;
  }
  .btns button:hover { background: rgba(255,255,255,.14); }
  .btns button.primary { background: rgba(110,168,255,.18); border-color: rgba(110,168,255,.45); }
  .btns button:disabled { opacity: .35; cursor: default; }
  .btns button:disabled:hover { background: rgba(255,255,255,.07); }

  .mood-row { display: flex; gap: 6px; padding: 8px 0 2px; }
  #mood-input {
    flex: 1; min-width: 0; padding: 7px 9px; font-size: 12.5px;
    color: #eef2fa; background: rgba(255,255,255,.07);
    border: 1px solid var(--panel-border); border-radius: 8px; outline: none;
  }
  #mood-input:focus { border-color: rgba(110,168,255,.55); }
  #mood-input::placeholder { color: #6b7690; }
  #mood-go {
    flex: 0 0 auto; padding: 0 13px; font-size: 12px;
    color: #dfe6f2; background: rgba(110,168,255,.18);
    border: 1px solid rgba(110,168,255,.45); border-radius: 8px; cursor: pointer;
  }
  #mood-go:hover { background: rgba(110,168,255,.3); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 7px 0 2px; }
  .chip {
    font-size: 11px; padding: 3px 10px; border-radius: 999px; user-select: none;
    background: rgba(255,255,255,.06); border: 1px solid var(--panel-border);
    color: #c3ccdd; cursor: pointer; transition: background .15s;
  }
  .chip:hover { background: rgba(110,168,255,.2); color: #eaf1ff; }
  #mood-read { font-size: 11px; color: #8fa3c8; padding: 5px 1px 2px; line-height: 1.55; }
  #hist-list {
    width: 100%; margin-top: 2px; padding: 4px; font-size: 11.5px;
    color: #cfe0ff; background: rgba(255,255,255,.05);
    border: 1px solid var(--panel-border); border-radius: 8px;
    scrollbar-width: thin;
  }
  #hist-list option { background: #141926; color: #cfe0ff; padding: 2px 4px; }

  #toggle-btn {
    position: fixed; top: 16px; right: 16px; z-index: 9;
    width: 38px; height: 38px; border-radius: 11px;
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    color: #dfe6f2; font-size: 17px; cursor: pointer;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: none; align-items: center; justify-content: center;
  }
  #toggle-btn.show { display: flex; }

  #fps {
    position: fixed; top: 16px; left: 16px; z-index: 5;
    font-size: 11px; color: rgba(20,26,40,.6);
    font-variant-numeric: tabular-nums; user-select: none; pointer-events: none;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }

  #err {
    position: fixed; inset: auto 16px 16px 16px; z-index: 20; display: none;
    max-height: 45vh; overflow: auto;
    background: rgba(40, 8, 12, .92); color: #ffb4be;
    border: 1px solid rgba(255, 90, 110, .4); border-radius: 10px;
    padding: 12px 14px; font: 11.5px/1.55 ui-monospace, Menlo, monospace;
    white-space: pre-wrap;
  }

  #toast {
    position: fixed; left: 50%; bottom: 76px; z-index: 30;
    transform: translateX(-50%) translateY(8px);
    background: rgba(14, 17, 28, .92); color: #e8ecf4;
    border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 9px 16px; font-size: 12.5px; line-height: 1.5;
    max-width: min(78vw, 560px); white-space: pre-wrap; text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>

<div id="fps"></div>

<button id="toggle-btn" title="显示控制面板 (H)">⚙</button>

<div id="panel">
  <div class="head"><span class="dot"></span>平静地思考 · Glass Pretzel<span class="spacer"></span></div>
  <div class="body">
    <div class="btns">
      <button id="btn-preset-mine" title="恢复琥珀橙定稿">🎨 我的定稿</button>
      <button id="btn-preset-orig" title="恢复 Shadertoy 原版参数">🧊 原版</button>
      <button id="btn-snap" title="保存当前画面为 PNG（不含面板）">📷 快照</button>
    </div>
    <div class="btns">
      <button id="btn-pause" class="primary">⏸ 暂停</button>
      <button id="btn-reset" title="恢复到「我的定稿」">↺ 重置</button>
      <button id="btn-hide" title="收起面板 (H)">✕</button>
    </div>
    <div class="btns">
      <button id="btn-link" title="把当前全部参数编码进链接，收藏或分享即可还原此画面">🔗 复制链接</button>
      <button id="btn-import" title="粘贴参数链接或 JSON 还原画面">📥 导入</button>
      <button id="btn-dice" title="在滑块范围内随机一组参数">🎲 随机</button>
    </div>
    <div class="sect">情绪 · 让它感受你</div>
    <div class="mood-row">
      <input id="mood-input" type="text" maxlength="24" placeholder="输入情绪或行为：平静 / 狂躁…">
      <button id="mood-go" title="让主体化入这个情绪">化入</button>
    </div>
    <div class="chips">
      <span class="chip" data-mood="平静地思考">🌊 平静</span>
      <span class="chip" data-mood="若有所思">🌧 忧郁</span>
      <span class="chip" data-mood="坐立不安">⚡ 焦躁</span>
      <span class="chip" data-mood="兴高采烈">✨ 兴奋</span>
      <span class="chip" data-mood="怒气冲冲">🔥 愤怒</span>
      <span class="chip" data-mood="歇斯底里">🌪 狂躁</span>
      <span class="chip" data-mood="爱">💛 爱</span>
      <span class="chip" data-mood="花">🌸 花</span>
    </div>
    <div id="mood-read">输入情绪或行为，它会化入其中——越激烈，形态越狂放、颜色越暖。</div>

    <div class="sect">时间线 · 可撤回</div>
    <div class="btns">
      <button id="btn-undo" title="撤回上一步 (⌘/Ctrl+Z)">↩ 撤销</button>
      <button id="btn-redo" title="重做 (⌘/Ctrl+Shift+Z)">↪ 重做</button>
    </div>
    <select id="hist-list" size="4" title="点任意一步直接回到那时"></select>

    <div id="ctrls"></div>
  </div>
</div>

<div class="title-card">
  <b>平静地思考 · Glass Pretzel</b><br>
  原作 © Jaenam（CC BY-NC-SA 4.0）· shadertoy.com/view/fcVXDd<br>
  输入一个情绪，它就化入那个情绪 · ⌘/Ctrl+Z 撤回任何一步<br>
  🖐 轻放停留 → 触点微光呼吸 · 🔥 快速划过 → 越快越激烈<br>
  拖动旋转 · 滚轮缩放 · 空格 暂停 · H 面板 · R 重置
</div>

<div id="err"></div>

<script>
"use strict";

/* ============================================================
 * Glass Pretzel — 本地参数化复刻
 * 原作: Jaenam (https://www.shadertoy.com/view/fcVXDd)
 * License: CC BY-NC-SA 4.0
 * 基于作者附在原帖注释中的可读版本，将常量改为 uniform 以便调节。
 * ============================================================ */

const VERT = `#version 300 es
void main() {
  vec2 v = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(v * 2.0 - 1.0, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;

uniform vec3  iResolution;
uniform float iTime;
uniform float uSpeed;      // 动画速度（JS 端作用在时间累加器上）
uniform float uTwist;      // 扭转强度      (原 1.5)
uniform float uRadius;     // 主体半径      (原 2.0)
uniform float uGap;        // 切口宽度      (原 0.7)
uniform float uGapOff;     // 切口偏移      (原 0)
uniform float uStretch;    // 纵向拉伸      (原 1)
uniform float uWobble;     // 波浪起伏      (原 0)
uniform float uTube;       // 管径粗细      (原 0.4)
uniform float uStep;       // 步进系数·辉光密度 (原 0.15)
uniform float uEps;        // 最小步长      (原 0.01)
uniform int   uIters;      // 迭代次数      (原 100)
uniform float uCamDist;    // 相机距离      (原 5.0)
uniform float uExposure;   // 曝光倍率      (原 1.0, 作用于 1e-6)
uniform float uGlowGain;   // 辉光增益      (原 1)
uniform float uPow;        // 光晕锐度      (原 2)
uniform float uDrift;      // 流光速度      (原 0)
uniform float uColorFreq;  // 色彩频率      (原 0.1)
uniform float uHue;        // 色相偏移      (原 0)
uniform float uWarmth;     // 冷暖色调      (原 1)
uniform float uHueRot;     // 色相旋转      (原 0)
uniform float uBase;       // 亮度基底      (原 1.1)
uniform float uCoef;       // 暗部浓度      (原 0.3)
uniform float uDrag;       // 鼠标拖拽附加旋转
uniform float uAgit;       // 鼠标互动激烈度 0..1（JS 端包络）
uniform float uAgitWarm;   // 激烈时暖橙渗色强度
uniform vec2  uMouse;      // 光标位置（设备像素，y 已翻转成 gl_FragCoord 约定）
uniform float uHover;      // 轻放强度 0..1（光标静置在主体上时升起）
uniform float uShapeMix;   // 造型 morph：0=默认椒盐卷饼，1=情绪造型
uniform float uShapeKind;  // 情绪造型种类：1=爱心 2=花朵
uniform int   uMaskMode;   // 1 = 输出物体能量掩码（供 JS 回读做触碰判定）

out vec4 fragColor;

#define R(a) mat2(cos(a+vec4(0,33,11,0)))
#define PI_ 3.14159265

vec3 hueRotate(vec3 c, float a) {
  const vec3 k = vec3(0.57735);
  float ca = cos(a), sa = sin(a);
  return c*ca + cross(k, c)*sa + k*dot(k, c)*(1.-ca);
}

float sdHeart(vec2 p){          // 心形 SDF（IQ 版，近似距离）
    p.x=abs(p.x);
    if(p.y+p.x>1.0) return sqrt(dot(p-vec2(0.25,0.75),p-vec2(0.25,0.75)))-sqrt(2.0)/4.0;
    return sqrt(min(dot(p-vec2(0.0,1.0),p-vec2(0.0,1.0)),dot(p-vec2(0.25,0.5),p-vec2(0.25,0.5))))-sqrt(3.0)/4.0;
}

void mainImage(out vec4 O, vec2 I)
{
    float i=0.0,d=0.0,s=0.0,a=0.0;   // 显式初始化：原混淆写法依赖未初始化变量，会引发渲染区块断层
    vec3 p,r=iResolution;

    for(O=vec4(0.0); i++<float(uIters); O.xy+=sin(i*uColorFreq+a+a+vec2(1,3)+uHue+iTime*uDrift)*uGlowGain/s)
    {
        vec2 so=(r.xy-I-I)/r.y;
        p=vec3(so*d,d-uCamDist);
        float hd=1e3;
        if(uHover>0.001){          // 轻放：以光标射线为轴的局部作用域
            vec2 sm=(r.xy-uMouse-uMouse)/r.y;
            vec3 v2=vec3(sm,1.0);
            hd=length(cross(vec3(so*d,d),v2))/length(v2);   // 采样点到光标射线的真实距离
            vec2 dir=normalize(so-sm+vec2(1e-4,1e-6));
            float g=exp(-hd*hd*12.0)*uHover;
            p.xy+=dir*g*(0.35+0.18*sin(iTime*2.4-hd*9.0));  // 触点明显隆起、缓缓呼吸
        }
    p.y/=uStretch;
    p.xz*=R((iTime+uDrag)*(1.0-0.92*uShapeMix));   // 造型态几乎停住偏航，让形状正对观众
    vec2 bc2 = R((iTime+uDrag)*(1.0-0.92*uShapeMix)) * vec2(-uRadius, 0.0);
    float beadR = (0.27 + 0.03*sin(iTime*1.7)) * (1.0 - smoothstep(0.3, 0.7, uShapeMix));
    float dBead = length(p - vec3(bc2.x, 0.0, bc2.y)) - beadR;   // 结点琉璃珠：盖住缠绕缝
    a=atan(p.y,p.x);
    if(uHover>0.001) a+=uHover*0.9*exp(-hd*hd*8.0)*sin(iTime*1.2);   // 触点局部旋绕：缠绕与色流随指尖打转
    float dRing=length(p.xy)-uRadius;
    if(uShapeMix>0.001){                                             // 造型 morph：整体化作情绪造型
        float dAlt=uShapeKind<1.5 ? sdHeart(-p.xy/3.2)*3.2   // 心形（翻转坐标使尖端朝屏幕下方）
                                  : length(p.xy)-(2.2+0.5*cos(6.0*a));
        dRing=mix(dRing,dAlt,uShapeMix);
    }
        p.x=dRing;
        p.xz *= R(a * uTwist);
        p.x=abs(p.x+uGapOff)-uGap;
        p.x+=uWobble*sin(p.y*3.);
        s=uEps+uStep*min(abs(length(p.xz)-uTube), dBead);   // 管体 + 结点琉璃珠
        if(uHover>0.001){          // 触点：热斑 + 指腹按压变暗 + 沿管壁荡开的涟漪
            float hg=uHover*exp(-hd*hd*7.0)/(1.0+s*s*140.0);
            float wave=0.5+0.5*sin(hd*13.0-iTime*4.5);
            O.z+=hg*1.1;
            O.xy+=hg*0.55*vec2(1.0,0.8);
            O.xy*=1.0-0.65*hg*(0.5+0.5*wave);
        }
        d+=s;
    }

    vec4 e = tanh(O*O/1e6);                 // 累计能量：物体的"实度"
    float energy = clamp(e.x + e.y, 0.0, 1.0);

    if (uMaskMode > 0) {            // 触碰掩码：能量归一，供 JS 回读
        O = vec4(energy);
        return;
    }

    float hv = clamp(O.z * 0.75, 0.0, 1.0);   // 轻放触点能量（下面的调色会覆盖 O，先取出）

    O = abs(uPow-2.)<.001 ? O*O : pow(abs(O),vec4(uPow));
    O=tanh(O/1e6*uExposure);
    O.y*=uWarmth;
    O=uBase+--O.x*(uCoef+O.y*vec4(1,1,0,0));
    if(abs(uHueRot)>.001) O.rgb=hueRotate(O.rgb,uHueRot);
    if (uAgit > 0.001) {            // 激烈时向暖橙渗色：按物体能量加权，背景不受染
        float w = uAgit * uAgit * uAgitWarm * energy;
        O.rgb = mix(O.rgb, vec3(1.0, 0.55, 0.18), w);
    }
    if (uHover > 0.001) {           // 轻放：触点局部暖光渗出
        float w = hv * energy;
        O.rgb = mix(O.rgb, vec3(1.0, 0.6, 0.18), w * 0.85);
        O.rgb += vec3(1.0, 0.55, 0.2) * (w * 1.2);
    }
}

void main() {
  vec4 c = vec4(0.0);
  mainImage(c, gl_FragCoord.xy);
  fragColor = vec4(c.rgb, 1.0);
}`;

/* ---------------- 参数定义 ---------------- */

const PARAMS = [
  { key: "speed",     group: "动画", label: "动画速度",        min: 0,    max: 3,     step: 0.01,  def: 1 },
  { key: "twist",     group: "形状", label: "扭转强度",        min: 0,    max: 4,     step: 0.01,  def: 1.5 },
  { key: "radius",    group: "形状", label: "主体半径",        min: 1,    max: 4,     step: 0.01,  def: 2 },
  { key: "gap",       group: "形状", label: "切口宽度",        min: 0,    max: 1.5,   step: 0.01,  def: 0.7 },
  { key: "gapOff",    group: "形状", label: "切口偏移",        min: -0.5, max: 0.5,   step: 0.005, def: 0 },
  { key: "stretch",   group: "形状", label: "纵向拉伸",        min: 0.5,  max: 2,     step: 0.01,  def: 1 },
  { key: "wobble",    group: "形状", label: "波浪起伏",        min: 0,    max: 0.6,   step: 0.005, def: 0 },
  { key: "tube",      group: "形状", label: "管径粗细",        min: 0.05, max: 1,     step: 0.01,  def: 0.4 },
  { key: "step",      group: "光效", label: "步长 · 辉光密度", min: 0.02, max: 0.4,   step: 0.005, def: 0.15 },
  { key: "iters",     group: "光效", label: "迭代次数",        min: 20,   max: 300,   step: 5,     def: 100, int: true },
  { key: "camDist",   group: "光效", label: "相机距离",        min: 2,    max: 12,    step: 0.1,   def: 5 },
  { key: "exposure",  group: "光效", label: "曝光",            min: 0.2,  max: 4,     step: 0.05,  def: 1 },
  { key: "glowGain",  group: "光效", label: "辉光增益",        min: 0.2,  max: 2,     step: 0.01,  def: 1 },
  { key: "pow",       group: "光效", label: "光晕锐度",        min: 1,    max: 4,     step: 0.05,  def: 2 },
  { key: "drift",     group: "光效", label: "流光速度",        min: 0,    max: 2,     step: 0.01,  def: 0 },
  { key: "colorFreq", group: "颜色", label: "色彩频率",        min: 0,    max: 0.5,   step: 0.005, def: 0.1 },
  { key: "hue",       group: "颜色", label: "色相偏移",        min: 0,    max: 6.283, step: 0.01,  def: 0 },
  { key: "warmth",    group: "颜色", label: "冷暖色调",        min: 0.2,  max: 2.5,   step: 0.01,  def: 1 },
  { key: "hueRot",    group: "颜色", label: "色相旋转",        min: 0,    max: 6.283, step: 0.01,  def: 0 },

/* ------- 参数编码进 URL：#p=<base64url JSON> ------- */

function encodeParams() {
  const o = {};
  for (const p of PARAMS) o[p.key] = p.value;
  return btoa(JSON.stringify(o)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeParams(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  return JSON.parse(atob(s));
}
function currentParamUrl() {
  return location.href.split("#")[0] + "#p=" + encodeParams();
}
function applyParamValues(o) {
  for (const p of PARAMS) {
    const v = o[p.key];
    if (typeof v === "number" && isFinite(v)) {
      p.value = Math.min(p.max, Math.max(p.min, p.int ? Math.round(v) : v));
    }
  }
  for (const p of PARAMS) if (p._refresh) p._refresh();
}
function applyHashParams() {
  const m = (location.hash || "").match(/^#p=([A-Za-z0-9\-_]+)/);
  if (!m) return false;
  try { applyParamValues(decodeParams(m[1])); saveParams(); return true; } catch (e) { return false; }
}

/* ---------------- WebGL 初始化 ---------------- */

const canvas = document.getElementById("glcanvas");
const errBox = document.getElementById("err");

const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, preserveDrawingBuffer: true });
if (!gl) {
  errBox.style.display = "block";
  errBox.textContent = "此浏览器不支持 WebGL2，无法运行。请使用较新的 Chrome / Edge / Firefox / Safari。";
  throw new Error("no webgl2");
}

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(sh) || "shader compile failed");
  }
  return sh;
}

let program = null;
function buildProgram() {
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(prog) || "link failed");
  }
  return prog;
}

try {
  program = buildProgram();
} catch (e) {
  errBox.style.display = "block";
  errBox.textContent = "着色器编译失败:\n" + e.message;
  throw e;
}
gl.useProgram(program);
const U = {};
for (const name of ["iResolution","iTime","uTwist","uRadius","uGap","uGapOff","uStretch","uWobble","uTube","uStep","uEps","uIters","uCamDist","uExposure","uGlowGain","uPow","uDrift","uColorFreq","uHue","uWarmth","uHueRot","uBase","uCoef","uDrag","uAgit","uAgitWarm","uMouse","uHover","uShapeMix","uShapeKind","uMaskMode"]) {
  U[name] = gl.getUniformLocation(program, name);
}

let currentMood = null;   // { label, icon, arousal, word, shape? }
let tween = null;         // 参数过渡动画 { from, to, t0, dur }
let shapeMix = 0;         // 造型 morph 进度 0..1
let shapeKind = 1;        // 1=爱心 2=花朵

function matchMood(raw) {
  const s = raw.toLowerCase();
  let best = null;
  for (const g of MOOD_LEXICON) {
    for (const w of g.words) {
      if (s === w || (w.length >= 2 && (s.includes(w) || w.includes(s)))) {
        if (!best || g.arousal > best.arousal) best = g;
      }
    }
  }
  if (best) return best;
  for (const c of CUE_GROUPS) if (c.re.test(s)) return c;
  return null;
}

function moodTargets(m) {
  // 情绪只控制"形体的躁动幅度"，颜色完全交给原有的 agit 干扰通道
  // （快速划过时的那套橙化/偏转/辉光响应，中间值自然有中间色）。
  const a = m.arousal, B = MY_PRESET, T = {};
  const put = (k, v) => { T[k] = Math.min(P[k].max, Math.max(P[k].min, P[k].int ? Math.round(v) : v)); };
  put("speed",     B.speed + (1.15 - B.speed) * a);
  put("twist",     B.twist + 1.35 * a);
  put("radius",    B.radius + 0.35 * a);
  put("gap",       B.gap - 0.18 * a);
  put("stretch",   B.stretch * (1 - 0.18 * a));
  put("tube",      B.tube * (1 - 0.28 * a));
  put("camDist",   B.camDist + 0.7 * a);
  if (m.shape === "heart") {   // 爱心：摊平缠绕、细管径低曝光，轮廓清晰镂空
    put("twist", 0.15); put("gap", 0.03); put("gapOff", 0); put("stretch", 1);
    put("tube", 0.2); put("radius", 2.36); put("camDist", 5.8);
    put("exposure", 1.05); put("glowGain", 0.65);
  } else if (m.shape === "flower") {   // 花朵：六瓣花环 + 轻微立体缠绕
    put("twist", 0.4); put("gap", 0.03); put("gapOff", 0); put("stretch", 0.9);
    put("tube", 0.24); put("radius", 2.5); put("camDist", 4.9);
    put("exposure", 1.1); put("glowGain", 0.75);
  }
  return T;
}

    (currentMood.shape === "heart" ? " · 造型已化作爱心" :
     currentMood.shape === "flower" ? " · 造型已化作花朵" : "");
}

function applyMood(m, raw) {
  tween = { from: snapshotValues(), to: moodTargets(m), t0: performance.now(), dur: 1700 };
  currentMood = { label: m.label, icon: m.icon, arousal: m.arousal, word: raw, shape: m.shape || null };

  const o = {};
  for (const p of PARAMS) o[p.key] = p.value;
  return o;
}
function pushHistory(label, values) {
  const vals = values || snapshotValues();
  const head = hist[histIdx];
  if (head && JSON.stringify(head.values) === JSON.stringify(vals)) { renderHist(); return; }
  hist.splice(histIdx + 1);   // 从中间撤回后再改，舍弃后面的重做分支
  hist.push({
    label, time: new Date(), values: vals,
    mood: currentMood ? JSON.parse(JSON.stringify(currentMood)) : null,
  });
  if (hist.length > 60) hist.shift();
  histIdx = hist.length - 1;
  renderHist();
}
function renderHist() {
  histList.innerHTML = "";
  hist.forEach((h, i) => {
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = "#" + i + " " + h.label + " · " +
      (h.time instanceof Date ? h.time : new Date(h.time)).toTimeString().slice(0, 5);
    histList.append(opt);
  });
  histList.selectedIndex = histIdx;
  btnUndo.disabled = histIdx <= 0;
  btnRedo.disabled = histIdx >= hist.length - 1;
}
function applySnapshot(i) {
  const h = hist[i];
  if (!h) return;
  histIdx = i;
  tween = null;
  applyParamValues(h.values);
  currentMood = h.mood ? { ...h.mood } : null;
  updateMoodRead();
  saveParams();
  renderHist();
  toast("⏱ 已回到 #" + i + " " + h.label);
}
function undo() { if (histIdx > 0) applySnapshot(histIdx - 1); }
function redo() { if (histIdx < hist.length - 1) applySnapshot(histIdx + 1); }
btnUndo.addEventListener("click", undo);
btnRedo.addEventListener("click", redo);
histList.addEventListener("change", () => applySnapshot(parseInt(histList.value, 10)));

function setPanelHidden(hidden) {
  panel.classList.toggle("hidden", hidden);
  toggleBtn.classList.toggle("show", hidden);
}
btnHide.addEventListener("click", () => setPanelHidden(true));
toggleBtn.addEventListener("click", () => setPanelHidden(false));

window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && (e.key === "z" || e.key === "Z")) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && (e.key === "y" || e.key === "Y")) { e.preventDefault(); redo(); }
  else if (e.code === "Space") { e.preventDefault(); setPaused(!paused); }
  else if (e.key === "h" || e.key === "H") setPanelHidden(!panel.classList.contains("hidden"));
  else if (e.key === "r" || e.key === "R") btnReset.click();
});

canvas.addEventListener("pointerdown", (e) => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add("dragging");
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  dragAngle += (e.clientX - lastX) * 0.008;
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener("pointerup", () => { dragging = false; canvas.classList.remove("dragging"); });
canvas.addEventListener("pointercancel", () => { dragging = false; canvas.classList.remove("dragging"); });

// 滚轮缩放：映射到相机距离滑块（连续滚动只在停下后记一步历史）
let wheelPushTimer = null;
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const p = P.camDist;
  p.value = Math.min(p.max, Math.max(p.min, p.value * Math.exp(e.deltaY * 0.0012)));
  p._refresh();
  saveParams();
  clearTimeout(wheelPushTimer);
  wheelPushTimer = setTimeout(() => pushHistory("缩放视野"), 600);
}, { passive: false });

// 显卡上下文丢失时给出提示，恢复后自动重载
canvas.addEventListener("webglcontextlost", (e) => {
  e.preventDefault();
  errBox.style.display = "block";
  errBox.textContent = "显卡上下文丢失，恢复中…";
});
canvas.addEventListener("webglcontextrestored", () => location.reload());

/* ---------------- 尺寸自适应 ---------------- */

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2) * P.renderScale.value;
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}
window.addEventListener("resize", resize);

/* ---------------- 鼠标互动：触碰掩码 + 激烈度包络 ---------------- */

// 64×36 迷你 FBO：每帧用同一 shader 渲一张"物体能量掩码"，
// 回读鼠标处 3×3 像素判定是否碰到物体 —— 判定天然跟随全部滑块参数。
const MASK_W = 64, MASK_H = 36;
const maskTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, maskTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, MASK_W, MASK_H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const maskFbo = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, maskFbo);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, maskTex, 0);
gl.bindFramebuffer(gl.FRAMEBUFFER, null);

const maskBuf = new Uint8Array(3 * 3 * 4);
let mouseX = -1, mouseY = -1, mouseIn = false;
let velSmooth = 0, agit = 0, moodAgit = 0, hover = 0, lastHit = 0, maskTick = 0;
let lastMX = null, lastMY = null;

canvas.addEventListener("pointermove", (e) => {
  mouseIn = true; mouseX = e.clientX; mouseY = e.clientY;
});
canvas.addEventListener("pointerleave", () => { mouseIn = false; lastMX = lastMY = null; });
window.addEventListener("blur", () => { velSmooth = 0; });

/* ---------------- 渲染循环 ---------------- */

const fpsEl = document.getElementById("fps");
let lastT = performance.now();
let fpsAccum = 0, fpsFrames = 0;

function frame(now) {
  requestAnimationFrame(frame);
  // rAF 在部分环境会以高于刷新率的频率触发（时间戳量化），高频重绘会让画布
  // 更新落在扫描线中间，形成固定的"拦腰"撕裂。用真实时间把绘制限制到 ≤60fps。
  if (now - lastT < 15) return;
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;

  if (!paused) simTime += dt * P.speed.value;

  /* ---- 鼠标速度（EMA 平滑，px/s → 0..1）---- */
  let speedNorm = 0;
  if (mouseIn && mouseX >= 0) {
    if (lastMX !== null) {
      const v = Math.hypot(mouseX - lastMX, mouseY - lastMY) / Math.max(dt, 1e-4);
      velSmooth += (v - velSmooth) * (1 - Math.exp(-dt / 0.12));
    }
    lastMX = mouseX; lastMY = mouseY;
    speedNorm = Math.min(1, Math.max(0, (velSmooth * P.agitSens.value - 150) / 2400));
  } else {
    velSmooth *= Math.exp(-dt / 0.2);
    lastMX = lastMY = null;
  }

  /* ---- 触碰判定：掩码 pass + 回读鼠标处 3×3（隔帧采样，回读有同步开销）---- */
  if (mouseIn && mouseX >= 0 && (maskTick++ % 2 === 0)) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, maskFbo);
    gl.viewport(0, 0, MASK_W, MASK_H);
    gl.uniform3f(U.iResolution, MASK_W, MASK_H, 1);
    gl.uniform1i(U.uMaskMode, 1);
    gl.uniform1f(U.uHover, 0);      // 掩码按未触扰的形态判定
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.uniform1i(U.uMaskMode, 0);
    gl.uniform1f(U.uHover, hover);
    const fx = Math.min(MASK_W - 2, Math.max(0, Math.round(mouseX / canvas.clientWidth * MASK_W) - 1));
    const fy = Math.min(MASK_H - 2, Math.max(0, Math.round((1 - mouseY / canvas.clientHeight) * MASK_H) - 1));
    gl.readPixels(fx, fy, 3, 3, gl.RGBA, gl.UNSIGNED_BYTE, maskBuf);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    lastHit = 0;
    for (let k = 0; k < maskBuf.length; k += 4) lastHit = Math.max(lastHit, maskBuf[k] / 255);
  }
  const hit = (mouseIn && mouseX >= 0) ? lastHit : 0;

  /* ---- 激烈度包络：0.15s 快起，~2s 慢衰 ---- */
  const target = hit * speedNorm;
  agit += (target - agit) * (1 - Math.exp(-dt / (target > agit ? 0.05 : 0.7)));
  if (agit < 0.001) agit = 0;

  /* ---- 轻放包络：光标静置在主体上时升起，快速划过时让位给激烈度 ---- */
  const rest = 1 - Math.min(1, speedNorm * 2.5);
  const hTarget = Math.min(1, hit * rest) * P.hoverGain.value;
  hover += (hTarget - hover) * (1 - Math.exp(-dt / (hTarget > hover ? 0.16 : 0.5)));
  if (hover < 0.001) hover = 0;

  /* ---- 情绪躁动基底：与光标快速干扰共用同一套色彩/形变通道 ---- */
  const mTarget = currentMood ? currentMood.arousal : 0;
  moodAgit += (mTarget - moodAgit) * (1 - Math.exp(-dt / 0.6));
  if (moodAgit < 0.001 && !currentMood) moodAgit = 0;

  /* ---- 造型 morph 进度（爱心/花朵等整体形状）---- */
  const sTarget = currentMood && currentMood.shape ? 1 : 0;
  shapeMix += (sTarget - shapeMix) * (1 - Math.exp(-dt / 0.55));
  if (shapeMix < 0.001 && sTarget === 0) shapeMix = 0;

  /* ---- 情绪参数过渡（约 1.7s 缓动到目标形态）---- */
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / tween.dur);
    const ease = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    for (const key in tween.to) {
      const p = P[key];
      p.value = tween.from[key] + (tween.to[key] - tween.from[key]) * ease;
      p._refresh();
    }
    if (k >= 1) { tween = null; saveParams(); }
  }

  /* ---- 主 pass ---- */
  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);
  const a = Math.min(1, agit + moodAgit) * P.agitPower.value;
  gl.uniform3f(U.iResolution, canvas.width, canvas.height, 1);
  gl.uniform1f(U.iTime, simTime);
  gl.uniform1f(U.uTwist, P.twist.value);
  gl.uniform1f(U.uRadius, P.radius.value);
  gl.uniform1f(U.uGap, P.gap.value);
  gl.uniform1f(U.uGapOff, P.gapOff.value);
  gl.uniform1f(U.uStretch, P.stretch.value);
  gl.uniform1f(U.uWobble, P.wobble.value + 0.25 * a);
  gl.uniform1f(U.uTube, P.tube.value);
  gl.uniform1f(U.uStep, P.step.value);
  gl.uniform1f(U.uEps, 0.01);   // 原作者标注的最小步长；不设置会导致 s=0 除零尖峰
  gl.uniform1i(U.uIters, Math.round(P.iters.value));
  gl.uniform1f(U.uCamDist, P.camDist.value);
  gl.uniform1f(U.uExposure, P.exposure.value * (1 + 0.35 * a));
  gl.uniform1f(U.uGlowGain, P.glowGain.value + 0.8 * a);
  gl.uniform1f(U.uPow, P.pow.value);
    gl.uniform1f(U.uDrift, P.drift.value * (1 + 1.2 * a));
  gl.uniform1f(U.uColorFreq, P.colorFreq.value);
  gl.uniform1f(U.uHue, P.hue.value);
  gl.uniform1f(U.uWarmth, P.warmth.value);
  gl.uniform1f(U.uHueRot, P.hueRot.value + P.agitHue.value * a);
  gl.uniform1f(U.uBase, P.base.value);
  gl.uniform1f(U.uCoef, P.coef.value);
  gl.uniform2f(U.uMouse,
    mouseX * canvas.width / Math.max(1, canvas.clientWidth),
    canvas.height - mouseY * canvas.height / Math.max(1, canvas.clientHeight));
  gl.uniform1f(U.uHover, hover);
  gl.uniform1f(U.uShapeMix, shapeMix);
  gl.uniform1f(U.uShapeKind, shapeKind);
  gl.uniform1f(U.uAgit, a);
  gl.uniform1f(U.uAgitWarm, P.agitWarm.value);
  gl.uniform1f(U.uDrag, dragAngle);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  fpsAccum += dt; fpsFrames++;
  if (fpsAccum >= 0.5) {
    fpsEl.textContent = Math.round(fpsFrames / fpsAccum) + " fps · " + canvas.width + "×" + canvas.height
      + (agit + moodAgit > 0.02 ? " · 🔥" + Math.round(Math.min(1, agit + moodAgit) * 100) + "%" : "")
      + (hover > 0.03 ? " · 🖐" + Math.round(hover * 100) + "%" : "")
      + (currentMood ? " · " + currentMood.icon + currentMood.label : "");
    fpsAccum = 0; fpsFrames = 0;
  }

  requestAnimationFrame(frame);
}

pushHistory("初始状态");   // 时间线起点：进入页面时的样子
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
